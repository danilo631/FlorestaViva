plugins { id 'com.android.application' }

android {
    namespace 'com.florestaviva.game'
    compileSdk 35
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId 'com.florestaviva.game'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '11.0'
        externalNativeBuild {
            cmake { cppFlags '-std=c++20 -O3 -ffp-contract=fast' }
        }
        ndk { abiFilters 'arm64-v8a' }
    }
    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt' }
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
