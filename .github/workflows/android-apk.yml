name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runners already include Android command-line tools.
      # Avoid android-actions/setup-android@v3, which currently tries to install
      # the removed legacy SDK package "tools" and fails before the build.
      - name: Instalar Android SDK, NDK e CMake
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$SDK_ROOT/cmdline-tools" ]]; then
            echo "::error::Android SDK command-line tools not found at $SDK_ROOT"
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager executable not found"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses < <(yes) > /dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.2.12479018' \
            'cmake;3.22.1'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK Debug
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: FlorestaViva-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
