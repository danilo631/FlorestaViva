name: Gerar APK Android
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar Android SDK, NDK e CMake
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses < <(yes) > /dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.2.12479018' \
            'cmake;3.22.1'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Gerar mapas de normais
        run: |
          python -m pip install --disable-pip-version-check pillow numpy
          python tools/material_maps.py --size 512
      - name: Compilar APK Debug
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: FlorestaViva-Graphics2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
