name: Gerar APK Android
on:
  workflow_dispatch:
  push:
    branches: [main, feat/step1-audit-assets, feat/step2-refactor]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fixar tag de rollback e registrar auditoria de commits
        if: github.ref == 'refs/heads/feat/step1-audit-assets'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/audit
          git log --oneline -n 30 | tee build/audit/git_log_30.txt
          git diff --stat eaca26c8b34d5287c4278e0cecaf8ffd2b7b5084..HEAD | tee build/audit/phase0_to_head_diff_stat.txt
          if ! git ls-remote --tags origin refs/tags/pre-step1 | grep -q pre-step1; then
            git tag pre-step1 c58078c495e0d20fb955265a34e974d389a25bb1
            git push origin refs/tags/pre-step1
          fi
          git show-ref --tags pre-step1 | tee build/audit/rollback_tag.txt
      - name: Auditar bytes reais dos assets versionados
        if: github.ref == 'refs/heads/feat/step1-audit-assets'
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tools/audit_repository.py --output build/audit/source_assets.json
          grep -nF -e 'texture(uGrassNormal' -e 'texture(uDirtNormal' -e 'texture(uMossNormal' -e 'texture(uMaterialNormal' -e 'texture(uGrassRough' -e 'texture(uDirtRough' -e 'texture(uMossRough' -e 'texture(uMaterialRough' app/src/main/cpp/game.cpp > build/audit/shader_sample_reads.txt
          cat build/audit/shader_sample_reads.txt
          python -m json.tool assets_manifest.json > build/audit/asset_manifest.json
          cp CREDITS.md build/audit/CREDITS.md
      - name: Publicar auditoria reprodutível de origem
        if: github.ref == 'refs/heads/feat/step1-audit-assets'
        uses: actions/upload-artifact@v4
        with:
          name: phase1-source-audit
          path: build/audit/
      - name: Tag obrigatoria pre-refactor para rollback
        if: github.ref == 'refs/heads/feat/step2-refactor'
        shell: bash
        run: |
          set -euo pipefail
          base=939acb003af5436d4d3abbcbff795440ba74b195
          if git ls-remote --tags origin refs/tags/pre-refactor | grep -q pre-refactor; then
            actual="$(git ls-remote --tags origin refs/tags/pre-refactor | cut -f1)"
            test "$actual" = "$base" || { echo "pre-refactor tag points to unexpected commit"; exit 1; }
          else
            git tag pre-refactor "$base"
            git push origin refs/tags/pre-refactor
          fi
          echo "Rollback tag verified: pre-refactor -> $base"
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Configurar Android SDK e NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses < <(yes) > /dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;28.2.13676358' \
            'cmake;3.22.1'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Gerar mapas de normais e atlas
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow numpy
          python tools/scanned_leaf_atlas.py --size 2048
          python tools/forest_materials.py
          python tools/foliage_pack.py --tile 1024
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          a=Path('app/src/main/assets')
          for p in ('foliage_color.png','foliage_normal.png'):
              img=Image.open(a/p)
              assert img.size==(2048,2048) and img.mode=='RGBA'
          PY
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          base=Path("app/src/main/assets")
          for name in ("pine_atlas","pine_normal","pine_bark","pine_bark_normal","rock","rock_normal"):
              p=base/(name+".png")
              assert p.is_file(),p
              assert Image.open(p).width>=512,name
          assert Image.open(base/"pine_atlas.png").mode=="RGBA"
          assert Image.open(base/"pine_normal.png").mode=="RGBA"
          PY
          python -c "from PIL import Image; a='app/src/main/assets/'; assert Image.open(a+'leaves_atlas.png').size==(2048,2048)"
      - name: Integrar materiais fotográficos PBR CC0
        shell: bash
        run: |
          set -euo pipefail
          python tools/photogrammetry_materials.py --strict
          cat app/src/main/assets/photogrammetry_manifest.txt
      - name: Gerar água, pedras, fauna e flores
        run: |
          set -euo pipefail
          python tools/river_wildlife_materials.py
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          a=Path('app/src/main/assets')
          for name in ('river_normal','riverbed','wildlife_fur','wildlife_fur_normal','wildflowers'):
              im=Image.open(a/(name+'.png'))
              assert im.width>=512 and im.height>=512,name
          assert Image.open(a/'wildlife_fur.png').size == (1536,512)
          PY
      - name: Substituir pedras artificiais por seixos fotográficos CC0
        shell: bash
        run: |
          set -euo pipefail
          python tools/photographic_riverbed.py
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          a=Path('app/src/main/assets')
          for name in ('riverbed.png','riverbed_normal.png'):
              with Image.open(a/name) as im:
                  assert im.size == (2048,2048), (name,im.size)
          PY
      - name: Fotogrametria CC0 musgo e pedras
        shell: bash
        run: |
          set -euo pipefail
          python tools/photographic_moss_rocks.py
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          a=Path('app/src/main/assets')
          for name in ('rock.png','rock_normal.png','rock_rough.png'):
              with Image.open(a/name) as img:
                  assert img.size==(2048,2048), (name,img.size)
          PY
      - name: Resolver materiais via Poly Haven API pública CC0
        shell: bash
        run: |
          set -euo pipefail
          python tests/polyhaven_api_test.py
          python tools/polyhaven_api_bake.py
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json
          a=Path("app/src/main/assets")
          for name in ('moss.png','moss_normal.png','moss_rough.png'):
              with Image.open(a/name) as im:
                  assert im.size==(2048,2048), (name,im.size)
          manifest=json.loads((a/'polyhaven_api_manifest.json').read_text())
          assert manifest['license']=='CC0' and len(manifest['files'])==3
          PY
      - name: 'Fase 1 - obter e validar material PBR 1K CC0 por checksum'
        shell: bash
        run: |
          set -euo pipefail
          python tools/fetch_assets.py --manifest assets_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path("app/src/main/assets")
          manifest=json.loads(Path("assets_manifest.json").read_text())
          output=json.loads((root/"assets_provenance.json").read_text())
          assert len(output["sources"])==len(manifest["texture_sets"])==9
          for asset in manifest["texture_sets"]:
              role=asset["role"]
              for key in (".png","_normal.png","_rough.png"):
                  with Image.open(root/(role+key)) as img:
                      assert img.size==(1024,1024), (role,key,img.size)
              with Image.open(root/(role+"_rough.png")) as packed:
                  from PIL import ImageStat
                  vals=ImageStat.Stat(packed).mean
                  assert 0<vals[0]<255 and 0<vals[1]<255 and vals[2]<.01,vals
          print("9 validated CC0 scanned PBR families + packed ORM; source checksums recorded")
          PY
      - name: Fase 1 - importar dois modelos glTF CC0 com LOD para Android
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check trimesh fast-simplification
          python tools/fetch_models.py
          python - <<'PY'
          import json,struct
          from pathlib import Path
          root=Path("app/src/main/assets")
          data=json.loads((root/"scanned_models_manifest.json").read_text())
          assert len(data)==2
          for model in data:
              assert len(model["converted"])==3
              for lod in model["converted"]:
                  path=root/lod["filename"]
                  blob=path.read_bytes()
                  assert blob[:8]==b'FVME0001'
                  verts,indices=struct.unpack_from("<II",blob,8)
                  assert verts>30 and indices>90 and indices%3==0
                  assert len(blob)==16+verts*48+indices*4
                  print("VALID GLTF LOD",lod["filename"],indices//3,"triangles")
          PY
      - name: Auditar materiais efetivamente incorporados ao APK
        if: github.ref == 'refs/heads/feat/step1-audit-assets'
        run: |
          python tools/audit_repository.py --include-untracked             --output build/audit/baked_assets.json
      - name: Gerar e auditar KTX2 ASTC 6x6 comprimido de fonte fotográfica
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_ktx2.py --limit 6
          python - <<'PY'
          import json,struct
          from pathlib import Path
          root=Path("app/src/main/assets")
          doc=json.loads((root/"ktx2_codec_manifest.json").read_text())
          assert len(doc["files"])==6
          for img in doc["files"]:
              raw=(root/"ktx2"/img["name"]).read_bytes()
              assert raw[:12]==bytes.fromhex("ab4b5458203230bb0d0a1a0a")
              vk_format=struct.unpack_from("<I",raw,12)[0]
              mip_count=struct.unpack_from("<I",raw,40)[0]
              assert vk_format==165 and mip_count>=9,(img["name"],vk_format,mip_count)
          print("KTX2_ASTC_NATIVE validated",len(doc["files"]))
          PY
      - name: Preparar prévia dos materiais fotografados
        run: |
          python tools/material_preview.py
          cp build/Graphics7_Materials_Preview.jpg build/Graphics12_Materials_Preview.jpg
      - name: Compilar shaders Vulkan de teste
        shell: bash
        run: |
          set -euo pipefail
          GLSLC="$(find "$ANDROID_HOME/ndk/28.2.13676358/shader-tools" -type f -name glslc | head -n 1)"
          test -n "$GLSLC"
          mkdir -p app/src/main/assets/vulkan
          "$GLSLC" shaders/foliage.vert -o app/src/main/assets/vulkan/foliage.vert.spv
          "$GLSLC" shaders/foliage.frag -o app/src/main/assets/vulkan/foliage.frag.spv
          "$GLSLC" shaders/wind.comp -o app/src/main/assets/vulkan/wind.comp.spv
      - name: Validar todos os shaders OpenGL ES
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          python tools/validate_gles_shaders.py
      - name: Testar geometria nativa das árvores
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra tests/forest_geometry_test.cpp -o /tmp/forest_geometry_test
          SCANNED_ASSET_DIR="$PWD/app/src/main/assets" FOREST_EXPORT_DIR="$PWD/build/forest-models" /tmp/forest_geometry_test
          cp app/src/main/assets/{bark,bark_normal,pine_bark,pine_bark_normal,pine_atlas,pine_normal,leaves_atlas,leaves_normal,canopy}.png build/forest-models/
      - name: Validar slots de materiais e reduzir tamanho do APK
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          from PIL import Image
          java=Path('app/src/main/java/com/florestaviva/game/MainActivity.java').read_text()
          group=java.split('String[] files = {',1)[1].split('};',1)[0]
          entries=re.findall(r'"([^"]*)"',group)
          assert len(entries)==39,entries
          assert entries[19:21] == ['foliage_color.png','foliage_normal.png'],entries
          assert entries[21:25] == ['grass_rough.png','soil_rough.png',
                                   'bark_rough.png','pine_bark_rough.png'],entries
          assert entries[25:30] == ['river_normal.png','riverbed.png',
                                  'wildlife_fur.png','wildlife_fur_normal.png','wildflowers.png'],entries
          assert entries[30:] == ['riverbed_normal.png','rock_rough.png','moss_rough.png',
                                 'bark_platanus.png','bark_platanus_normal.png','bark_platanus_rough.png',
                                 'bark_willow.png','bark_willow_normal.png','bark_willow_rough.png'],entries
          asset=Path('app/src/main/assets')
          for filename in entries:
              if filename: assert (asset/filename).exists(),filename
          albedo=Image.open(asset/'foliage_color.png')
          for y in (0,1024):
              for x in (0,1024):
                  cropped=albedo.crop((x,y,x+1024,y+1024))
                  assert cropped.getchannel('A').getbbox() is not None
          print('Valid material slots, unified atlas quadrants and generated textures')
          PY
          # The original source textures remain in Git to regenerate the atlas;
          # only the consolidated atlas and actively used PBR maps enter the APK.
          rm app/src/main/assets/{blades,bush,leaves_atlas,leaves_normal,pine_atlas,pine_normal}.png
      - name: Testar mecânicas nativas de sobrevivência
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra tests/survival_test.cpp -o /tmp/forest_survival_test
          /tmp/forest_survival_test
      - name: Testar hidrologia e biomas
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra tests/river_biome_test.cpp -o /tmp/river_biome_test
          /tmp/river_biome_test
      - name: Compartilhar assets reais para captura Android x86_64
        if: github.ref == 'refs/heads/feat/step1-audit-assets' || github.ref == 'refs/heads/feat/step2-refactor'
        uses: actions/upload-artifact@v4
        with:
          name: phase1-baked-assets
          path: app/src/main/assets/
          retention-days: 3
      - name: Publicar SHA256 comparativos da versão compilada
        if: github.ref == 'refs/heads/feat/step1-audit-assets'
        uses: actions/upload-artifact@v4
        with:
          name: phase1-baked-audit
          path: build/audit/
      - name: Compilar APK Debug
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Confirmar APK Android 64 bits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import zipfile
          apk='app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as z:
              native=[n for n in z.namelist() if n.endswith('libflorestaviva.so')]
              assert native == ['lib/arm64-v8a/libflorestaviva.so'],native
              raw=z.read(native[0])
              assert raw[:5] == b'\x7fELF\x02'
              print('Verified Android ELF64 ARM64: ',len(raw),'bytes')
          PY
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: FlorestaViva-Graphics12-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publicar APK direto em GitHub Releases
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk FlorestaViva-Graphics12.apk
          if ! gh release view graphics12 >/dev/null 2>&1; then
            gh release create graphics12 --title 'Floresta Viva Graphics 12' --notes 'Graphics 12: animação local por pivôs em folhas e sombras, fauna por estados, coleta de madeira/pedra/ervas, energia/hidratação, API Poly Haven e engine Android atualizada. Inclui fauna, biomas, missoes e salto. APK com assets embutidos, exclusivo Android ARM64. Assinado com chave debug temporaria: a atualizacao sobre uma versao anterior pode exigir desinstalacao, apagando o progresso.'
          fi
          gh release upload graphics12 FlorestaViva-Graphics12.apk --clobber
      - name: Publicar comparação dos materiais
        uses: actions/upload-artifact@v4
        with:
          name: FlorestaViva-Graphics12-Material-Preview
          path: build/Graphics12_Materials_Preview.jpg
          if-no-files-found: error
      - name: Publicar modelos 3D editáveis
        uses: actions/upload-artifact@v4
        with:
          name: FlorestaViva-3D-Trees-OBJ
          path: build/forest-models/
          if-no-files-found: error


      - name: Versionar mapas PBR fotografados no Git apos build verde
        if: github.ref == 'refs/heads/feat/step1-audit-assets'
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_SHA="$(git ls-remote origin refs/heads/feat/step1-audit-assets | cut -f1)"
          if [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
            echo "Skip vendor commit from stale CI run: $GITHUB_SHA vs $REMOTE_SHA"
            exit 0
          fi
          python - <<'PY' > /tmp/forest_vendor_files.txt
          import json
          from pathlib import Path
          root=Path("app/src/main/assets")
          data=json.loads(Path("assets_manifest.json").read_text())
          targets=[]
          for asset in data["texture_sets"]:
              for ext in (".png","_normal.png","_rough.png","_height.png"):
                  candidate=root/(asset["role"]+ext)
                  if candidate.is_file():targets.append(candidate)
          targets.extend(root.glob("ktx2/*.ktx2"))
          targets.extend(root.glob("scanned_*.fvmesh"))
          targets.extend([root/"assets_provenance.json",root/"scanned_models_manifest.json",
                          root/"ktx2_codec_manifest.json",root/"foliage_color.png",
                          root/"foliage_normal.png"])
          for target in targets:
              if target.is_file():print(target)
          PY
          while IFS= read -r path; do git add -f -- "$path"; done < /tmp/forest_vendor_files.txt
          if git diff --cached --quiet; then
            echo "No changes to verified photographic inputs"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Vendor photographed CC0 PBR maps, KTX2 textures and scanned glTF LOD binaries"
          git push origin HEAD:refs/heads/feat/step1-audit-assets

  capture:
    if: github.ref == 'refs/heads/feat/step1-audit-assets' || github.ref == 'refs/heads/feat/step2-refactor'
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout code and emulator capture harness
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Fetch built and pinned PBR assets
        uses: actions/download-artifact@v4
        with:
          name: phase1-baked-assets
          path: app/src/main/assets
      - name: Install native Android x86_64 build tools
        shell: bash
        run: |
          set -euo pipefail
          MGR="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          "$MGR" --sdk_root="$ANDROID_HOME" --licenses < <(yes) > /dev/null
          "$MGR" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          gradle :app:assembleDebug -PforestAbi=x86_64 --no-daemon --stacktrace
          python - <<'PY'
          import zipfile
          apk='app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as zip:
              assert 'lib/x86_64/libflorestaviva.so' in zip.namelist()
          print('PASS debug x86_64 emulator APK, production remains ARM64')
          PY
      - name: Detect host KVM availability (fast fail if unavailable)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -c /dev/kvm ]; then
            echo "ERROR: /dev/kvm absent. GitHub hosted runner cannot run this Android emulator in bounded time."
            exit 2
          fi
          sudo chmod a+rw /dev/kvm
          ls -l /dev/kvm
          grep -E 'vmx|svm' /proc/cpuinfo | head -1 || true
          mkdir -p build/emulator
          printf "Host has KVM; capturing Android x86_64 SwiftShader baseline.\n" > build/emulator/host.txt
      - name: Render screenshots with Android SwiftShader software GPU
        timeout-minutes: 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 256M
          emulator-boot-timeout: 420
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-boot-anim -accel on
          script: |
            if [ "$GITHUB_REF" = "refs/heads/feat/step2-refactor" ]; then export FOREST_CAPTURE_PREFIX=after; fi
            timeout 360 bash tools/ci_capture_android.sh
      - name: Download approved before screenshots
        if: github.ref == 'refs/heads/feat/step2-refactor'
        uses: actions/download-artifact@v4
        with:
          run-id: 38329848118
          github-token: ${{ github.token }}
          name: phase1-emulator-before-screenshots-and-video
          path: build/baseline
      - name: Record comparable before/after screenshot deltas
        if: github.ref == 'refs/heads/feat/step2-refactor'
        shell: bash
        run: |
          python tools/compare_emulator_images.py --before build/baseline --after build/emulator
      - name: Upload 4 fixed-camera frames and short screenrecord
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref == 'refs/heads/feat/step2-refactor' && 'phase2-emulator-after-screenshots-and-video' || 'phase1-emulator-before-screenshots-and-video' }}
          path: build/emulator/
          if-no-files-found: warn
