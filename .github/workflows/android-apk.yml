name: Gerar APK Android
on:
  workflow_dispatch:
  push:
    branches: [main, master, graphics3-atlas-vulkan-sky, graphics4-procedural-aaa-vegetation, graphics5-dense-vegetation-vulkan-compute, graphics6-shadows-material-rework, graphics7-scanned-foliage-postfx, graphics8-rivers-wildlife-quests-arm64]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configurar Android SDK e NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses < <(yes) > /dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.2.12479018' \
            'cmake;3.22.1'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Gerar mapas de normais e atlas
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow numpy
          python tools/material_maps.py --size 512
          python tools/scanned_leaf_atlas.py --size 2048
          python tools/forest_materials.py
          python tools/foliage_pack.py --tile 1024
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          a=Path('app/src/main/assets')
          for p in ('foliage_color.png','foliage_normal.png'):
              img=Image.open(a/p)
              assert img.size==(2048,2048) and img.mode=='RGBA'
          PY
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          base=Path("app/src/main/assets")
          for name in ("pine_atlas","pine_normal","pine_bark","pine_bark_normal","rock","rock_normal"):
              p=base/(name+".png")
              assert p.is_file(),p
              assert Image.open(p).width>=512,name
          assert Image.open(base/"pine_atlas.png").mode=="RGBA"
          assert Image.open(base/"pine_normal.png").mode=="RGBA"
          PY
          python -c "from PIL import Image; a='app/src/main/assets/'; assert Image.open(a+'leaves_atlas.png').size==(2048,2048)"
      - name: Integrar materiais fotográficos PBR CC0
        shell: bash
        run: |
          set -euo pipefail
          python tools/photogrammetry_materials.py --strict
          cat app/src/main/assets/photogrammetry_manifest.txt
      - name: Gerar água, pedras, fauna e flores
        run: |
          set -euo pipefail
          python tools/river_wildlife_materials.py
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          a=Path('app/src/main/assets')
          for name in ('river_normal','riverbed','wildlife_fur','wildlife_fur_normal','wildflowers'):
              im=Image.open(a/(name+'.png'))
              assert im.width>=512 and im.height>=512,name
          assert Image.open(a/'wildlife_fur.png').size == (1536,512)
          PY
      - name: Preparar prévia dos materiais fotografados
        run: |
          python tools/material_preview.py
          cp build/Graphics7_Materials_Preview.jpg build/Graphics8_Materials_Preview.jpg
      - name: Compilar shaders Vulkan de teste
        shell: bash
        run: |
          set -euo pipefail
          GLSLC="$(find "$ANDROID_HOME/ndk/27.2.12479018/shader-tools" -type f -name glslc | head -n 1)"
          test -n "$GLSLC"
          mkdir -p app/src/main/assets/vulkan
          "$GLSLC" shaders/foliage.vert -o app/src/main/assets/vulkan/foliage.vert.spv
          "$GLSLC" shaders/foliage.frag -o app/src/main/assets/vulkan/foliage.frag.spv
          "$GLSLC" shaders/wind.comp -o app/src/main/assets/vulkan/wind.comp.spv
      - name: Validar todos os shaders OpenGL ES
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          python tools/validate_gles_shaders.py
      - name: Testar geometria nativa das árvores
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra tests/forest_geometry_test.cpp -o /tmp/forest_geometry_test
          FOREST_EXPORT_DIR="$PWD/build/forest-models" /tmp/forest_geometry_test
          cp app/src/main/assets/{bark,bark_normal,pine_bark,pine_bark_normal,pine_atlas,pine_normal,leaves_atlas,leaves_normal,canopy}.png build/forest-models/
      - name: Validar slots de materiais e reduzir tamanho do APK
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          from PIL import Image
          java=Path('app/src/main/java/com/florestaviva/game/MainActivity.java').read_text()
          group=java.split('String[] files = {',1)[1].split('};',1)[0]
          entries=re.findall(r'"([^"]*)"',group)
          assert len(entries)==30,entries
          assert entries[19:21] == ['foliage_color.png','foliage_normal.png'],entries
          assert entries[21:25] == ['grass_rough.png','soil_rough.png',
                                   'bark_rough.png','pine_bark_rough.png'],entries
          assert entries[25:] == ['river_normal.png','riverbed.png',
                                  'wildlife_fur.png','wildlife_fur_normal.png','wildflowers.png'],entries
          asset=Path('app/src/main/assets')
          for filename in entries:
              if filename: assert (asset/filename).exists(),filename
          albedo=Image.open(asset/'foliage_color.png')
          for y in (0,1024):
              for x in (0,1024):
                  cropped=albedo.crop((x,y,x+1024,y+1024))
                  assert cropped.getchannel('A').getbbox() is not None
          print('Valid material slots, unified atlas quadrants and generated textures')
          PY
          # The original source textures remain in Git to regenerate the atlas;
          # only the consolidated atlas and actively used PBR maps enter the APK.
          rm app/src/main/assets/{blades,bush,leaves_atlas,leaves_normal,pine_atlas,pine_normal}.png
      - name: Testar hidrologia e biomas
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra tests/river_biome_test.cpp -o /tmp/river_biome_test
          /tmp/river_biome_test
      - name: Compilar APK Debug
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Confirmar APK Android 64 bits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import zipfile
          apk='app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as z:
              native=[n for n in z.namelist() if n.endswith('libflorestaviva.so')]
              assert native == ['lib/arm64-v8a/libflorestaviva.so'],native
              raw=z.read(native[0])
              assert raw[:5] == b'\x7fELF\x02'
              print('Verified Android ELF64 ARM64: ',len(raw),'bytes')
          PY
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: FlorestaViva-Graphics8-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publicar APK direto em GitHub Releases
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk FlorestaViva-Graphics8.apk
          if ! gh release view graphics8 >/dev/null 2>&1; then
            gh release create graphics8 --title 'Floresta Viva Graphics 8' --notes 'Graphics 8: rios, fauna com 3 especies, 4 biomas, 4 missoes e salto. APK com assets embutidos, exclusivo Android ARM64. Assinado com chave debug temporaria: a atualizacao sobre uma versao anterior pode exigir desinstalacao, apagando o progresso.'
          fi
          gh release upload graphics8 FlorestaViva-Graphics8.apk --clobber
      - name: Publicar comparação dos materiais
        uses: actions/upload-artifact@v4
        with:
          name: FlorestaViva-Graphics8-Material-Preview
          path: build/Graphics8_Materials_Preview.jpg
          if-no-files-found: error
      - name: Publicar modelos 3D editáveis
        uses: actions/upload-artifact@v4
        with:
          name: FlorestaViva-3D-Trees-OBJ
          path: build/forest-models/
          if-no-files-found: error
